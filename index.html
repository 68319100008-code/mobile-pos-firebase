<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile POS & Inventory ออนไลน์</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- HTML5-QRCode Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; background: white; border-radius: 12px; overflow: hidden; }
        .mode-badge { font-size: 1.1rem; font-weight: bold; }
        .scan-cooldown { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div class="container py-3">
    <h3 class="text-center mb-2 fw-bold text-primary">📱 ระบบจัดการร้านค้าอัจฉริยะ</h3>
    <p class="text-center text-muted small mb-3">วิทยาลัยเทคนิคมีนบุรี | เทคโนโลยีธุรกิจดิจิทัล</p>

    <!-- ส่วนเลือกโหมดการทำงาน -->
    <div class="row g-2 mb-3">
        <div class="col-6">
            <button id="btn-mode-sell" class="btn btn-primary w-100 fw-bold py-2" onclick="switchMode('sell')">🛒 โหมดขายหน้าร้าน</button>
        </div>
        <div class="col-6">
            <button id="btn-mode-stock" class="btn btn-outline-warning text-dark w-100 fw-bold py-2" onclick="switchMode('stock')">📦 โหมดสแกนรับของ</button>
        </div>
    </div>

    <!-- แสดงโหมดปัจจุบัน -->
    <div class="text-center mb-3">
        <span id="current-mode-badge" class="badge bg-primary mode-badge px-4 py-2">กำลังทำงาน: โหมดขายหน้าร้าน</span>
    </div>

    <!-- ส่วนของกล้องสแกน -->
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-body p-2 text-center">
            <div id="reader"></div>
            <div id="scan-status" class="text-muted small mt-2 fw-bold">ระบบกล้องพร้อมสแกน...</div>
        </div>
    </div>

    <!-- ตารางรายการในโหมดขายสินค้า -->
    <div id="sell-section" class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-dark text-white fw-bold">รายการสินค้ารอชำระเงิน</div>
        <div class="card-body p-0">
            <table class="table table-striped m-0" id="cart-table">
                <thead>
                    <tr>
                        <th>สินค้า</th>
                        <th class="text-center">จำนวน</th>
                        <th class="text-end">ราคา</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="card-footer p-3 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-bold">ยอดรวมทั้งสิ้น:</span>
                <span class="fs-3 fw-bold text-success"><span id="total-price">0.00</span> บาท</span>
            </div>
            <button class="btn btn-success btn-lg w-100 fw-bold" onclick="processCheckout()">💵 ยืนยันชำระเงิน & ตัดสต็อก</button>
        </div>
    </div>
</div>

<!-- หน้าต่างป็อปอัป (Modal) สำหรับโหมดสแกนรับของเข้าสต็อก -->
<div class="modal fade" id="productModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title fw-bold" id="modalTitle">📦 จัดการสต็อกสินค้า</h5>
                <button type="button" class="btn-close" onclick="closeMyModal()" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">รหัสบาร์โค้ด</label>
                        <input type="text" id="form-barcode" class="form-control bg-light" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">ชื่อสินค้า</label>
                        <input type="text" id="form-name" class="form-control" placeholder="กรุณากรอกชื่อสินค้า" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">ราคาขาย (บาท)</label>
                        <input type="number" id="form-price" class="form-control" step="0.25" placeholder="0.00" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-primary" id="label-stock">จำนวนที่รับเข้าสต็อก</label>
                        <input type="number" id="form-stock" class="form-control border-primary" placeholder="0" required>
                        <div id="stock-help" class="form-text text-muted"></div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2">💾 บันทึกข้อมูลคลังสินค้า</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase Configuration -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 วาง Firebase Config ของคุณตรงนี้
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentMode = 'sell'; 
    let cart = [];
    let isScanning = true; 
    let isModalOpen = false;

    // ฟังก์ชันเปิด-ปิด Modal ด้วย JavaScript แบบเสถียร
    const modalEl = document.getElementById('productModal');
    const bModal = new bootstrap.Modal(modalEl);

    window.closeMyModal = function() {
        bModal.hide();
        isModalOpen = false;
        resumeScanner();
    }

    // ฟังก์ชันสลับโหมดการทำงาน
    window.switchMode = function(mode) {
        currentMode = mode;
        const badge = document.getElementById('current-mode-badge');
        const sellSection = document.getElementById('sell-section');
        const btnSell = document.getElementById('btn-mode-sell');
        const btnStock = document.getElementById('btn-mode-stock');

        if (mode === 'sell') {
            badge.innerText = "กำลังทำงาน: โหมดขายหน้าร้าน";
            badge.className = "badge bg-primary mode-badge px-4 py-2";
            sellSection.style.display = "block";
            btnSell.className = "btn btn-primary w-100 fw-bold py-2";
            btnStock.className = "btn btn-outline-warning text-dark w-100 fw-bold py-2";
        } else {
            badge.innerText = "กำลังทำงาน: โหมดสแกนรับของ";
            badge.className = "badge bg-warning text-dark mode-badge px-4 py-2";
            sellSection.style.display = "none";
            btnSell.className = "btn btn-outline-primary w-100 fw-bold py-2";
            btnStock.className = "btn btn-warning w-100 fw-bold py-2";
        }
    }

    function triggerCooldown() {
        isScanning = false;
        document.getElementById('reader').classList.add('scan-cooldown');
        document.getElementById('scan-status').innerHTML = "⏳ กำลังประมวลผล...";
    }

    window.resumeScanner = function() {
        if (isModalOpen) return; // ถ้าหน้าต่างกรอกข้อมูลยังเปิดอยู่ ไม่ต้องเปิดกล้อง
        setTimeout(() => {
            isScanning = true;
            document.getElementById('reader').classList.remove('scan-cooldown');
            document.getElementById('scan-status').innerHTML = "🟢 ระบบกล้องพร้อมสแกน...";
        }, 2000); 
    }

    // ฟังก์ชันหลักเมื่อสแกนบาร์โค้ดเจอ
    async function onScanSuccess(decodedText) {
        if (!isScanning || isModalOpen) return; 
        
        triggerCooldown(); 

        try {
            const docRef = doc(db, "products", decodedText);
            const docSnap = await getDoc(docRef);

            if (currentMode === 'sell') {
                // --- โหมดขายสินค้า ---
                if (docSnap.exists()) {
                    const product = docSnap.data();
                    if (product.stock > 0) {
                        addProductToCart(decodedText, product.name, product.price, product.stock);
                    } else {
                        alert(`❌ สินค้า '${product.name}' หมดสต็อก`);
                    }
                } else {
                    alert(`❌ ไม่พบรหัสสินค้า [${decodedText}] ในระบบ คาดว่าเป็นสินค้าใหม่`);
                }
                resumeScanner();
            } else {
                // --- โหมดรับของเข้าสต็อก ---
                isModalOpen = true;
                document.getElementById('form-barcode').value = decodedText;
                
                if (docSnap.exists()) {
                    // เคส 1: มีของเดิมอยู่แล้ว ให้กรอกเพิ่มจำนวนอย่างเดียว
                    const product = docSnap.data();
                    document.getElementById('modalTitle').innerText = "📦 รับสินค้าเดิมเข้าสต็อก";
                    document.getElementById('form-name').value = product.name;
                    document.getElementById('form-name').readOnly = true;
                    document.getElementById('form-price').value = product.price;
                    document.getElementById('form-price').readOnly = true;
                    
                    document.getElementById('label-stock').innerText = "จำนวนที่รับเพิ่มเข้าคลัง";
                    document.getElementById('form-stock').value = "";
                    document.getElementById('stock-help').innerText = `*จำนวนปัจจุบันในคลัง: ${product.stock} ชิ้น`;
                } else {
                    // เคส 2: สินค้าใหม่แกะกล่อง เปิดให้กรอกข้อมูลเพื่อเพิ่มเข้าฐานข้อมูลใหม่
                    document.getElementById('modalTitle').innerText = "✨ เพิ่มสินค้าใหม่เข้าสู่ระบบ";
                    document.getElementById('form-name').value = "";
                    document.getElementById('form-name').readOnly = false;
                    document.getElementById('form-price').value = "";
                    document.getElementById('form-price').readOnly = false;
                    
                    document.getElementById('label-stock').innerText = "จำนวนสต็อกเริ่มต้น";
                    document.getElementById('form-stock').value = "";
                    document.getElementById('stock-help').innerText = "*สินค้านี้ยังไม่มีในคลังระบบ จะทำการเพิ่มใหม่";
                }
                
                bModal.show();
                setTimeout(() => document.getElementById('form-stock').focus(), 500);
            }
        } catch (error) {
            console.error(error);
            resumeScanner();
        }
    }

    // แก้ไขบั๊กส่วนบันทึกข้อมูลฟอร์ม: รองรับการสร้างเอกสารใหม่ (สินค้าใหม่) 100%
    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const barcode = document.getElementById('form-barcode').value;
        const name = document.getElementById('form-name').value;
        const price = parseFloat(document.getElementById('form-price').value);
        const inputStock = parseInt(document.getElementById('form-stock').value);

        try {
            const productRef = doc(db, "products", barcode);
            const docSnap = await getDoc(productRef);

            let finalStock = inputStock;
            
            if (docSnap.exists()) {
                // สินค้าเดิม: เอาค่าเก่าใน Firebase มาบวกเพิ่ม
                finalStock = docSnap.data().stock + inputStock;
            }

            // ใช้คำสั่ง setDoc ในการสร้างตัวหนาข้อมูลใหม่ หรืออัปเดตทับจุดเดิม
            await setDoc(productRef, {
                name: name,
                price: price,
                stock: finalStock
            }, { merge: true }); // เปิดโหมด merge ป้องกันการเขียนทับพลาดไฟล์

            alert('💾 บันทึกข้อมูลคลังสินค้าเรียบร้อยแล้ว!');
            
            // เคลียร์ค่าหน้าต่างและสั่งปิด
            document.getElementById('productForm').reset();
            bModal.hide();
            isModalOpen = false;
            
            resumeScanner(); 
        } catch (error) {
            alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + error.message);
            bModal.hide();
            isModalOpen = false;
            resumeScanner();
        }
    });

    // ส่วนประมวลผลตะกร้าสินค้าฝั่งขาย
    function addProductToCart(barcode, name, price, maxStock) {
        let existingItem = cart.find(item => item.barcode === barcode);
        if (existingItem) {
            if (existingItem.quantity < maxStock) {
                existingItem.quantity += 1;
            } else {
                alert("จำนวนในตะกร้าถึงขีดจำกัดคลังสินค้าแล้ว");
            }
        } else {
            cart.push({ barcode: barcode, name: name, price: price, quantity: 1 });
        }
        updateCartUI();
    }

    function updateCartUI() {
        const tbody = document.querySelector('#cart-table tbody');
        tbody.innerHTML = '';
        let total = 0;
        cart.forEach(item => {
            tbody.innerHTML += `<tr>
                <td>${item.name}</td>
                <td class="text-center">${item.quantity}</td>
                <td class="text-end">${(item.price * item.quantity).toFixed(2)}</td>
            </tr>`;
            total += item.price * item.quantity;
        });
        document.getElementById('total-price').innerText = total.toFixed(2);
    }

    window.processCheckout = async function() {
        if (cart.length === 0) return alert('กรุณาสแกนสินค้าก่อนชำระเงิน');
        try {
            for (let item of cart) {
                const productRef = doc(db, "products", item.barcode);
                const productSnap = await getDoc(productRef);
                await updateDoc(productRef, { stock: productSnap.data().stock - item.quantity });
            }
            await addDoc(collection(db, "sales"), { items: cart, total: parseFloat(document.getElementById('total-price').innerText), date: new Date() });
            alert('🎉 ชำระเงินและตัดสต็อกเรียบร้อย!');
            cart = [];
            updateCartUI();
        } catch (error) {
            alert(error.message);
        }
    }

    // เริ่มระบบกล้องสแกน
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: { width: 260, height: 160 } });
    html5QrcodeScanner.render(onScanSuccess);
    switchMode('sell');
</script>

</body>
</html>
