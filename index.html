<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบ POS สแกนบาร์โค้ดด้วย Firebase</title>
    <!-- ไลบรารีสแกนบาร์โค้ด -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        #reader { width: 100%; max-width: 500px; margin: auto; }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- ส่วนบน: สแกนและคิดเงิน -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- ฝั่งซ้าย: กล้องสแกน และ การจัดการสินค้า -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4 text-blue-600">🎥 สแกนบาร์โค้ดผ่านกล้อง</h2>
                <div id="reader" class="border-2 border-dashed border-gray-300 rounded mb-4"></div>
                <p id="scan-result" class="text-center text-sm text-gray-500 mt-2">ผลการสแกนล่าสุด: ไม่มี</p>

                <hr class="my-6">

                <h2 class="text-xl font-bold mb-4 text-green-600">💾 บันทึกสินค้าลง Firebase</h2>
                <form id="product-form" class="space-y-3">
                    <div>
                        <label class="block text-sm">รหัสบาร์โค้ด (Scan หรือพิมพ์)</label>
                        <input type="text" id="p-barcode" class="w-full p-2 border rounded" required>
                    </div>
                    <div>
                        <label class="block text-sm">ชื่อสินค้า</label>
                        <input type="text" id="p-name" class="w-full p-2 border rounded" required>
                    </div>
                    <div>
                        <label class="block text-sm">ราคาสินค้า (บาท)</label>
                        <input type="number" id="p-price" class="w-full p-2 border rounded" required>
                    </div>
                    <button type="submit" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600 font-bold">บันทึกสินค้า</button>
                </form>
            </div>

            <!-- ฝั่งขวา: ตะกร้าสินค้าคิดเงิน -->
            <div class="bg-white p-6 rounded-lg shadow-md flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold mb-4 text-red-600">🛒 รายการชำระเงิน (POS)</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b">
                                    <th class="pb-2">สินค้า</th>
                                    <th class="pb-2 text-center">จำนวน</th>
                                    <th class="pb-2 text-right">ราคา</th>
                                </tr>
                            </thead>
                            <tbody id="cart-table-body">
                                <!-- รายการสินค้าจะเพิ่มเข้ามาที่นี่ -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="mt-6 border-t pt-4">
                    <div class="flex justify-between text-2xl font-bold mb-4">
                        <span>ยอดรวมทั้งสิ้น:</span>
                        <span class="text-blue-600"><span id="cart-total">0</span> บาท</span>
                    </div>
                    <button onclick="checkout()" class="w-full bg-blue-600 text-white text-xl p-3 rounded-lg font-bold hover:bg-blue-700 shadow-md">
                        💰 ชำระเงิน
                    </button>
                </div>
            </div>

        </div>

        <!-- ส่วนล่าง: ตารางแสดงรายการสินค้าทั้งหมดในคลังข้อมูล -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-purple-600">📦 รายการสินค้าทั้งหมดในระบบ Firebase</h2>
                <button onclick="window.loadAllProducts()" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded text-sm font-bold flex items-center gap-1">
                    🔄 รีเฟรชรายการ
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b">
                            <th class="p-3">รหัสบาร์โค้ด (Document ID)</th>
                            <th class="p-3">ชื่อสินค้า</th>
                            <th class="p-3 text-right">ราคา (บาท)</th>
                        </tr>
                    </thead>
                    <tbody id="all-products-tbody">
                        <tr>
                            <td colspan="3" class="p-4 text-center text-gray-500">กำลังดาวน์โหลดข้อมูลสินค้าจาก Firebase...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- นำเข้าโมดูล Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ นำค่า config ที่ได้จากหน้าเว็บ Firebase Console มาแทนที่จุดนี้ทั้งหมด
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // เริ่มการทำงานของ Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ดึงข้อมูลรายชิ้นเมื่อทำการสแกน ---
        async function fetchProduct(barcode) {
            try {
                const docRef = doc(db, "products", barcode);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    return docSnap.data();
                } else {
                    return null;
                }
            } catch (error) {
                console.error("Error fetching product:", error);
                alert("เกิดข้อผิดพลาดในการดึงข้อมูล: " + error.message);
                return null;
            }
        }

        // --- ดึงข้อมูลสินค้าทั้งหมดมาแสดงในตารางด้านล่าง ---
        async function loadAllProducts() {
            const tbody = document.getElementById('all-products-tbody');
            tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-500">กำลังโหลด...</td></tr>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                tbody.innerHTML = '';
                
                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-400">ยังไม่มีข้อมูลสินค้าในคลังระบบของคุณ</td></tr>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const tr = document.createElement('tr');
                    tr.className = 'border-b hover:bg-gray-50';
                    tr.innerHTML = `
                        <td class="p-3 font-mono text-sm text-gray-600">${doc.id}</td>
                        <td class="p-3 font-semibold text-gray-800">${data.name}</td>
                        <td class="p-3 text-right font-bold text-blue-600">${data.price.toLocaleString()} บาท</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-red-500">❌ ไม่สามารถดึงข้อมูลได้: ${error.message}</td></tr>`;
            }
        }
        // ทำให้ฟังก์ชันเปิดเผยออกไปภายนอกโมดูลเพื่อให้ปุ่ม HTML เรียกใช้ได้
        window.loadAllProducts = loadAllProducts;

        // --- บันทึกข้อมูลสินค้าใหม่ ---
        document.getElementById('product-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const barcode = document.getElementById('p-barcode').value.trim();
            const name = document.getElementById('p-name').value.trim();
            const price = parseFloat(document.getElementById('p-price').value);

            try {
                await setDoc(doc(db, "products", barcode), {
                    name: name,
                    price: price
                });

                alert(`💾 บันทึกสินค้า "${name}" ลง Firebase สำเร็จ!`);
                document.getElementById('product-form').reset();
                loadAllProducts(); // โหลดรายการสินค้าใหม่ทันทีหลังบันทึกเสร็จ
            } catch (error) {
                alert("❌ บันทึกไม่สำเร็จ: " + error.message);
            }
        });


        // --- ตะกร้าสินค้า (POS Cart Logic) ---
        let cart = [];

        async function addToCart(barcode) {
            document.getElementById('scan-result').innerText = `กำลังตรวจสอบรหัส: ${barcode}...`;
            const product = await fetchProduct(barcode);

            if (!product) {
                document.getElementById('p-barcode').value = barcode;
                document.getElementById('scan-result').innerText = `ไม่พบสินค้ารหัส: ${barcode}`;
                alert(`⚠️ ไม่พบสินค้ารหัส: ${barcode} ในฐานข้อมูล คุณสามารถกดกรอกรายละเอียดบันทึกเข้าคลังได้ทันที`);
                return;
            }

            document.getElementById('scan-result').innerText = `สแกนพบ: ${product.name}`;

            const existingItem = cart.find(item => item.barcode === barcode);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    barcode: barcode,
                    name: product.name,
                    price: product.price,
                    quantity: 1
                });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const tbody = document.getElementById('cart-table-body');
            tbody.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                const subtotal = item.price * item.quantity;
                total += subtotal;

                const tr = document.createElement('tr');
                tr.className = 'border-b text-sm';
                tr.innerHTML = `
                    <td class="py-3 font-medium">${item.name}<br><span class="text-xs text-gray-400">${item.barcode}</span></td>
                    <td class="py-3 text-center font-bold text-gray-700">${item.quantity}</td>
                    <td class="py-3 text-right font-semibold">${subtotal.toLocaleString()} บาท</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('cart-total').innerText = total.toLocaleString();
        }

        window.checkout = function() {
            if (cart.length === 0) {
                alert("กรุณาสแกนสินค้าเข้าตะกร้าก่อนชำระเงิน");
                return;
            }
            alert("💵 ชำระเงินสำเร็จแล้ว!");
            cart = [];
            updateCartUI();
        }

        function playBeep() {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const osc = context.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, context.currentTime); 
            osc.connect(context.destination);
            osc.start();
            osc.stop(context.currentTime + 0.1);
        }

        // --- ตั้งค่าเปิดกล้องหลังสำหรับมือถือ ---
        let html5QrcodeScanner;

        function onScanSuccess(decodedText, decodedResult) {
            playBeep();
            html5QrcodeScanner.clear().then(() => {
                addToCart(decodedText);
                setTimeout(() => { startScanner(); }, 1500);
            }).catch(err => console.error(err));
        }

        function startScanner() {
            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = { 
                fps: 15, 
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    let width = Math.floor(viewfinderWidth * 0.75);
                    let height = Math.floor(viewfinderHeight * 0.35);
                    if (width < 250) width = 250;
                    if (height < 140) height = 140;
                    return { width: width, height: height };
                },
                aspectRatio: 1.777778
            };

            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess,
                (err) => {}
            ).catch((err) => {
                // ตัวเลือกสำรอง หากเปิดกล้องหลังแบบเลือกเจาะจงไม่ได้
                html5QrcodeScanner.start({ facingMode: "user" }, config, onScanSuccess).catch(e => {});
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                startScanner();
                loadAllProducts(); // ดาวน์โหลดสินค้าทั้งหมดขึ้นมาโชว์ในตารางทันทีเมื่อโหลดหน้าเว็บ
            }, 500);
        });
    </script>
</body>
</html>
