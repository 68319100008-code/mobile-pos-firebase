<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile POS ออนไลน์ - ร้านขายของชำ</title>
    <!-- Bootstrap สำหรับมือถือ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ไลบรารีสแกนบาร์โค้ดผ่านกล้องเว็บ -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-light">

<div class="container py-3">
    <h3 class="text-center mb-3">📱 POS ออนไลน์สแกนผ่านมือถือ</h3>
    
    <!-- ส่วนของกล้องสแกน -->
    <div class="card mb-3 shadow-sm">
        <div class="card-header bg-primary text-white text-center fw-bold">กล้องสแกนบาร์โค้ด</div>
        <div class="card-body p-2">
            <div id="reader" style="width: 100%; max-width: 400px; margin: 0 auto;"></div>
        </div>
    </div>

    <!-- รายการสินค้าในตะกร้า -->
    <div class="card mb-3 shadow-sm">
        <div class="card-header bg-dark text-white fw-bold">รายการสินค้ารอชำระเงิน</div>
        <div class="card-body p-0">
            <table class="table table-striped m-0" id="cart-table">
                <thead>
                    <tr>
                        <th>สินค้า</th>
                        <th class="text-center">จำนวน</th>
                        <th class="text-end">ราคา</th>
                    </tr>
                </thead>
                <tbody><!-- ข้อมูลเพิ่มอัตโนมัติเมื่อสแกน --></tbody>
            </table>
        </div>
    </div>

    <!-- สรุปราคาและปุ่มจบการขาย -->
    <div class="card p-3 shadow-sm mb-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="fw-bold">ยอดรวมทั้งสิ้น:</span>
            <span class="fs-3 fw-bold text-success"><span id="total-price">0.00</span> บาท</span>
        </div>
        <button class="btn btn-success btn-lg w-100 fw-bold" onclick="processCheckout()">💵 ยืนยันการชำระเงิน (ตัดสต็อกออนไลน์)</button>
    </div>
</div>

<!-- โหลด Firebase SDK โมดูลเสริม -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 นำโค้ด Firebase Config ของคุณมาวางแทนที่ตรงนี้
    const firebaseConfig = {
            apiKey: "AIzaSyC2-aIGelpGyjYE7aXZhUe7_ivoPMmmrKw",
            authDomain: "pos1-a4156.firebaseapp.com",
            projectId: "pos1-a4156",
            storageBucket: "pos1-a4156.firebasestorage.app",
            messagingSenderId: "792816247252",
            appId: "1:792816247252:web:03921a6ada05cc41f97641",
            measurementId: "G-4H69L5EH7L"
    };

    // เริ่มต้นเชื่อมต่อ Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let cart = [];

    // ฟังก์ชันทำงานเมื่อกล้องสแกนเจอบาร์โค้ด
    async function onScanSuccess(decodedText) {
        try {
            // ดึงข้อมูลสินค้าจาก Cloud Firestore โดยใช้เลขบาร์โค้ดเป็น ID Document
            const docRef = doc(db, "products", decodedText);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const product = docSnap.data();
                if (product.stock > 0) {
                    addProductToCart(decodedText, product.name, product.price, product.stock);
                    
                    // สแกนสำเร็จแล้วหยุดกล้อง 2 วินาทีเพื่อป้องกันการสแกนซ้ำซ้อน
                    html5QrcodeScanner.clear();
                    setTimeout(startScanner, 2000);
                } else {
                    alert(`สินค้า '${product.name}' หมดสต็อกแล้ว`);
                }
            } else {
                alert(`ไม่พบรหัสสินค้า: ${decodedText} ในระบบฐานข้อมูล`);
            }
        } catch (error) {
            console.error("เกิดข้อผิดพลาดในการดึงข้อมูล:", error);
        }
    }

    function addProductToCart(barcode, name, price, maxStock) {
        let existingItem = cart.find(item => item.barcode === barcode);
        if (existingItem) {
            if (existingItem.quantity < maxStock) {
                existingItem.quantity += 1;
            } else {
                alert("จำนวนสินค้าในตะกร้าเท่ากับจำนวนสต็อกที่มีอยู่แล้ว");
            }
        } else {
            cart.push({ barcode: barcode, name: name, price: price, quantity: 1 });
        }
        updateCartUI();
    }

    function updateCartUI() {
        const tbody = document.querySelector('#cart-table tbody');
        tbody.innerHTML = '';
        let total = 0;

        cart.forEach(item => {
            let row = `<tr>
                <td>${item.name}</td>
                <td class="text-center">${item.quantity}</td>
                <td class="text-end">${(item.price * item.quantity).toFixed(2)}</td>
            </tr>`;
            tbody.innerHTML += row;
            total += item.price * item.quantity;
        });

        document.getElementById('total-price').innerText = total.toFixed(2);
    }

    // ฟังก์ชันชำระเงินและบันทึกข้อมูล/ตัดสต็อกออนไลน์แบบเรียลไทม์
    window.processCheckout = async function() {
        if (cart.length === 0) return alert('กรุณาสแกนเลือกสินค้าก่อนชำระเงิน');

        try {
            for (let item of cart) {
                // 1. อัปเดตหักลบจำนวนสินค้าคงคลังในสต็อกออนไลน์
                const productRef = doc(db, "products", item.barcode);
                const productSnap = await getDoc(productRef);
                const currentStock = productSnap.data().stock;
                
                await updateDoc(productRef, {
                    stock: currentStock - item.quantity
                });
            }

            // 2. บันทึกประวัติการขายลงตารางยอดขาย (Sales Orders)
            await addDoc(collection(db, "sales"), {
                items: cart,
                total_price: parseFloat(document.getElementById('total-price').innerText),
                timestamp: new Date()
            });

            alert('🎉 บันทึกการขายและตัดสต็อกออนไลน์เรียบร้อยแล้ว!');
            cart = [];
            updateCartUI();

        } catch (error) {
            alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + error.message);
        }
    }

    function startScanner() {
        html5QrcodeScanner.render(onScanSuccess);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 150 } });
    startScanner();
</script>

</body>
</html>
